services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    container_name: pokerelay
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - relay_data:/data
    networks:
      - proxy
    expose:
      - "8780"
    mem_limit: 128m
    pids_limit: 128

volumes:
  relay_data:

networks:
  proxy:
    external: true
    name: robsengamingproxy
