services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [relay_credential]
    mem_limit: 128m
    pids_limit: 128
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_HOST: ${RELAY_HOST:?Set RELAY_HOST to your relay DNS name}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]
secrets:
  relay_credential:
    file: ./secrets/relay-credential
volumes:
  caddy_data:
  caddy_config:
