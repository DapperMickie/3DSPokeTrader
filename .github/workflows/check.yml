name: Check and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: sh scripts/test-native.sh
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - uses: actions/checkout@v4
      - name: Install makerom
        run: sh scripts/install-makerom.sh /opt/devkitpro/tools/bin
      - run: make -C 3ds
      - uses: actions/upload-artifact@v4
        with:
          name: PokeTrader-3ds
          path: |
            3ds/PokeTrader.3dsx
            3ds/PokeTrader.cia
            3ds/PokeTrader.smdh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-3ds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: PokeTrader-3ds
          path: 3ds
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py --binaries 3ds --version "${RELEASE_TAG#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "PokeTrader $GITHUB_REF_NAME" \
            3ds/PokeTrader.3dsx \
            3ds/PokeTrader.cia \
            3ds/PokeTrader.smdh \
            dist/PokeTrader-3ds-*.zip \
            dist/PokeTrader-source-*.zip \
            dist/build-info.json
