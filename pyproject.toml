[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poke-trader-bridge"
version = "0.3.0"
description = "Local and private remote FRLG exchanges between 3DS and Switch systems"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

[project.optional-dependencies]
remote = ["cryptography>=46,<51"]

[project.scripts]
poke-trader = "poketrader.__main__:main"

[tool.setuptools.packages.find]
include = ["poketrader*"]

[tool.setuptools.package-data]
poketrader = ["species.json", "species-info.json"]
